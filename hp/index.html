<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quick Verification 🎭</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin:0; padding:0;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display:flex; align-items:center; justify-content:center;
    height:100vh; text-align:center;
  }
  .container { 
    background: rgba(255,255,255,0.95); 
    padding:25px 20px; border-radius:16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    max-width: 360px; width:90%; display:flex;
    flex-direction: column; align-items:center;
  }
  h1{margin-bottom:15px;color:#e91e63;font-size:1.5rem;}
  label{margin:10px 0 5px; font-weight:bold;}
  input[type="text"]{
    padding:12px;width:100%;border:2px solid #e91e63;
    border-radius:10px;margin-bottom:15px;font-size:16px;outline:none;
  }
  button{
    padding:12px;width:100%;border:none;
    background:linear-gradient(135deg,#e91e63,#ad1457);
    color:white;border-radius:10px;font-size:16px;font-weight:bold;
    cursor:pointer;margin-bottom:10px;transition: transform 0.2s ease, background 0.3s ease;
  }
  button:hover:not(:disabled){transform:scale(1.05);}
  .error{color:red;margin-top:12px;display:none;font-size:0.95rem;font-weight:bold;}
  #scoldBtn{display:none;}
  /* Modal */
  .modal { display:none; position:fixed; z-index:100; left:0;top:0;width:100%;height:100%; overflow:auto; background: rgba(0,0,0,0.5);}
  .modal-content { background:#fff;margin:20% auto;padding:20px;border-radius:12px; width:80%; max-width:300px;}
  .modal-content h3{margin-bottom:15px;}
  .modal-content button{width:100%; margin:5px 0;}
</style>
</head>
<body>

<div id="verifyForm" class="container">
  <h1>Quick identity verification </h1>
  <label for="native">💭 What is our happy place?</label>
  <input type="text" id="native" />
  <button onclick="verifyUser()">Submit</button>

  <p id="verifyErr" class="error">❌ Who the fuck are you?</p>
  <button id="scoldBtn" onclick="openScold()">Don't understand? Select language 😈</button>
  <p id="scoldText" class="error" style="display:none;"></p>
</div>

<div id="scoldModal" class="modal">
  <div class="modal-content">
    <h3>Pick your scolding language </h3>
    <button onclick="scold('tamil')">Tamil</button>
    <button onclick="scold('telugu')">Telugu</button>
    <button onclick="scold('hindi')">Hindi</button>
    <button onclick="scold('malayalam')">Malayalam</button>
    <button onclick="scold('kannada')">Kannada</button>
  </div>
</div>

<script>
function verifyUser(){
  const nativeInput = document.getElementById('native').value.trim().toLowerCase();
  const errorEl = document.getElementById('verifyErr');
  const scoldBtn = document.getElementById('scoldBtn');

  if(nativeInput === 'pooja'){ 
    // ✅ Success → go to riddle page
    window.location.href = "riddle.html"; 
  } else {
    errorEl.style.display = 'block';
    scoldBtn.style.display = 'block'; 
  }
}
function openScold(){ document.getElementById('scoldModal').style.display='block'; }
function scold(lang){
  let msg="";
  if(lang==='tamil') msg="Dei loosu payale! Nee Madhavi illaye.";
  else if(lang==='telugu') msg="Oy pichchi vaadu! Evvara nuvu.. Nuvvu Madhavi kaadu.";
  else if(lang==='hindi') msg="Arre gadhe! Tu Madhavi nahi hai.";
  else if(lang==='malayalam') msg="Da mone! Nee Madhavi alla.";
  else if(lang==='kannada') msg="Ay b*** magane! Neenu Madhavi alla.";
  document.getElementById('scoldText').textContent = msg;
  document.getElementById('scoldText').style.display = 'block';
  document.getElementById('scoldModal').style.display = 'none';
}
window.onclick = function(event) {
  const modal = document.getElementById('scoldModal');
  if(event.target == modal) modal.style.display = "none";
}
</script>

</body>
</html>
